<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Thank You — Michael Curtiss</title>
  <link rel="stylesheet" href="mckc.css" />
      <link rel="manifest" href="site.webmanifest">
    <link rel="icon" href="favicon.ico" type="image/png">
  <style>
    .thank-you {
      max-width: 600px;
      margin: 5rem auto;
      padding: 2rem;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }
    .thank-you h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .thank-you p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }
    .thank-you a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #333;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.3s ease;
    }
    .thank-you a:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <header>
    <h1>Michael Curtiss</h1>
    <p>Software Engineer</p>
  </header>

  <main>
    <div class="thank-you">
      <h1>Thank You!</h1>
      <p>Your message has been sent successfully. I’ll be in touch soon.</p>
      <a href="index.html">Back to Home</a>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Michael Curtiss — Kansas City, MO</p>
  </footer>
</body>
</html>
